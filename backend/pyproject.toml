[project]
name = "backend"
version = "0.1.0"
description = "Thalace Shops backend: FastAPI API and LangGraph agents"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.162.2",
    "langchain-core>=1.7.6",
    "langchain-openai>=1.7.4",
    "langchain-qwq>=0.4.0",
    "langgraph>=1.2.20",
    "mcp>=2.3.0",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Live tests reach real external APIs; run them with `pytest -m live`.
markers = ["live: reaches a real external API"]
addopts = "-m 'not live'"
filterwarnings = ["ignore::DeprecationWarning:langsmith.*"]

[tool.ruff]
line-length = 120
exclude = ["app/database/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
