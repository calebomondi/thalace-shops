# Render Blueprint for Thalace Shops: the API and the web app.
# Setup steps, including what to set outside Render: docs/deploy-render.md
#
# Secrets are `sync: false`: Render asks for them when the Blueprint is first
# applied, and they never live in this file.

services:
  # FastAPI + the shop agents. One always-on instance: the payment watcher,
  # payout queues and agent runs live inside this process, so it must not
  # sleep (free tier) or run as several copies.
  - type: web
    name: thalace-shops-api
    runtime: python
    plan: starter
    region: frankfurt # same region as the Supabase project (eu-central-1)
    # Deploys from dev during the hackathon; switch to main for the submission.
    branch: dev
    autoDeployTrigger: commit
    numInstances: 1
    rootDir: backend
    # uv installs the Python in .python-version (3.14) inside the project
    # directory, so the interpreter ships with the build.
    buildCommand: >-
      export UV_PYTHON_INSTALL_DIR="$PWD/.python" UV_PYTHON_PREFERENCE=only-managed &&
      pip install uv==0.11.21 &&
      uv sync --frozen --no-dev
    # Migrations run before the new version starts; a failed one stops the deploy.
    preDeployCommand: .venv/bin/alembic upgrade head
    startCommand: .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_FORMAT
        value: json
      # Supabase transaction pooler (port 6543): a deploy runs the old and
      # new instance side by side, which the session pooler's client cap
      # can't hold. The direct host is IPv6-only and Render can't reach it.
      - key: DB_POOL_SIZE
        value: "4"
      - key: DB_MAX_OVERFLOW
        value: "4"
      - key: FRONTEND_BASE_URL
        value: https://shops.thalace.com
      - key: NEAR_INTENTS_AGENT_API_URL
        value: https://api.demo.agentsonintents.com
      - key: NEAR_MAINNET_PLATFORM_TREASURY_WALLET_ADDRESS
        value: thalaceshops.near
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_BASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: ADMIN_BOOTSTRAP_EMAILS
        sync: false
      - key: NEAR_INTENTS_AGENT_API_KEY
        sync: false
      # A Fernet key made once for production; never change it after shops go live.
      - key: SHOP_GRANT_KEY
        sync: false
      - key: NEAR_AI_CLOUD_API_KEY
        sync: false
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: DASHSCOPE_BASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: KRA_PIN_CHECKER_CONS_KEY
        sync: false
      - key: KRA_PIN_CHECKER_CONS_SECRET
        sync: false
      - key: KRA_TAX_COMP_CERT_CHECKER_CONS_KEY
        sync: false
      - key: KRA_TAX_COMP_CERT_CHECKER_CONS_SECRET
        sync: false

  # The web app at shops.thalace.com: founder console, shop pages, invoices.
  # Passkeys are bound to this domain, so it must stay the same.
  - type: web
    name: thalace-shops-app
    runtime: static
    branch: dev
    autoDeployTrigger: commit
    buildCommand: cd frontend && bun install --frozen-lockfile && bun run build
    staticPublishPath: ./frontend/dist
    domains:
      - shops.thalace.com
    buildFilter:
      paths:
        - frontend/**
    routes:
      # /api/* goes to the API, so the app and the API share one origin
      # (as the Vite proxy does in dev) and need no CORS. If Render gave the
      # API a different hostname, change it here.
      - type: rewrite
        source: /api/*
        destination: https://thalace-shops-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: BUN_VERSION
        value: 1.3.14
      # Baked in at build time: redeploy the site after changing them.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
